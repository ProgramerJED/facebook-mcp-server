name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Smoke-import the MCP server (no network)
        env:
          FACEBOOK_ACCESS_TOKEN: dummy
          FACEBOOK_PAGE_ID: dummy
        run: python -c "import server; print('server imports OK')"
